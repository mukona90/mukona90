<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
    text { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 13px; dominant-baseline: middle; }
    @keyframes cl0 { 0%,0% { opacity: 0 } 2%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes cl1 { 0%,5% { opacity: 0 } 7%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes cl2 { 0%,10% { opacity: 0 } 12%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes cl3 { 0%,15% { opacity: 0 } 17%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes cl4 { 0%,20% { opacity: 0 } 22%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes cl5 { 0%,25% { opacity: 0 } 27%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes cl6 { 0%,30% { opacity: 0 } 32%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .cl0 { animation: cl0 12s ease-in-out infinite }
    .cl1 { animation: cl1 12s ease-in-out infinite }
    .cl2 { animation: cl2 12s ease-in-out infinite }
    .cl3 { animation: cl3 12s ease-in-out infinite }
    .cl4 { animation: cl4 12s ease-in-out infinite }
    .cl5 { animation: cl5 12s ease-in-out infinite }
    .cl6 { animation: cl6 12s ease-in-out infinite }
  </style>
  <!-- Window background -->
  <rect width="100%" height="100%" fill="#1e1e1e" rx="14" ry="14"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="30" fill="#2c2c2c" rx="14" ry="14"/>
  <rect x="0" y="16" width="800" height="14" fill="#2c2c2c"/>
  <g opacity="0.55">
    <circle cx="22" cy="15" r="5.5" fill="#ff5f57"/>
    <circle cx="40" cy="15" r="5.5" fill="#febc2e"/>
    <circle cx="58" cy="15" r="5.5" fill="#28c840"/>
  </g>
  <text x="400" y="16" fill="#6a737d" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle">profile.json</text>

  <!-- Tab bar -->
  <rect x="0" y="30" width="800" height="32" fill="#2c2c2c"/>
  <rect x="0" y="30" width="156" height="32" fill="#252525"/>
  <!-- Active tab pill -->
  <rect x="156" y="30" width="160" height="32" fill="#1e1e1e"/>
  <rect x="156" y="30" width="160" height="2" fill="#569cd6"/>
  <text x="172" y="46" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="11" dominant-baseline="middle">profile.json</text>
  <text x="300" y="46" fill="#6a737d" font-family="ui-monospace, monospace" font-size="11" dominant-baseline="middle">×</text>

  <!-- Sidebar -->
  <rect x="0" y="62" width="156" height="238" fill="#252525"/>
  <text x="20" y="74" fill="#6a737d" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.2" dominant-baseline="middle">EXPLORER</text>
  <rect x="0" y="86" width="156" height="22" fill="#d4d4d4" fill-opacity="0.06"/><text x="20" y="100" fill="#d4d4d4" font-size="12" dominant-baseline="middle">header.svg</text>
  <text x="20" y="122" fill="#6a737d" font-size="12" dominant-baseline="middle">about.svg</text>
  <text x="20" y="144" fill="#6a737d" font-size="12" dominant-baseline="middle">skills.svg</text>
  <text x="20" y="166" fill="#6a737d" font-size="12" dominant-baseline="middle">gh-stats.svg</text>
  <text x="20" y="188" fill="#6a737d" font-size="12" dominant-baseline="middle">footer.svg</text>
  <!-- Vertical divider between sidebar and editor -->
  <line x1="156" y1="62" x2="156" y2="300" stroke="#353535" stroke-width="1"/>

  <!-- Editor body -->
  <g class="cl0">
    <text x="184" y="138" fill="#6a737d" text-anchor="end" font-size="11">1</text>
    <g transform="translate(194 138)"><text x="0" fill="#d4d4d4">{</text></g>
  </g>
  <g class="cl1">
    <text x="184" y="158" fill="#6a737d" text-anchor="end" font-size="11">2</text>
    <g transform="translate(194 158)"><text x="15.6" fill="#569cd6">&quot;name&quot;</text><text x="62.4" fill="#d4d4d4">:</text><text x="78" fill="#ce9178">&quot;Mukonazwothe Mudau&quot;</text><text x="234" fill="#d4d4d4">,</text></g>
  </g>
  <g class="cl2">
    <text x="184" y="178" fill="#6a737d" text-anchor="end" font-size="11">3</text>
    <g transform="translate(194 178)"><text x="15.6" fill="#569cd6">&quot;role&quot;</text><text x="62.4" fill="#d4d4d4">:</text><text x="78" fill="#ce9178">&quot;Software Engineer&quot;</text><text x="226.2" fill="#d4d4d4">,</text></g>
  </g>
  <g class="cl3">
    <text x="184" y="198" fill="#6a737d" text-anchor="end" font-size="11">4</text>
    <g transform="translate(194 198)"><text x="15.6" fill="#569cd6">&quot;org&quot;</text><text x="54.6" fill="#d4d4d4">:</text><text x="70.2" fill="#ce9178">&quot;University of Johannesburg&quot;</text><text x="288.59999999999997" fill="#d4d4d4">,</text></g>
  </g>
  <g class="cl4">
    <text x="184" y="218" fill="#6a737d" text-anchor="end" font-size="11">5</text>
    <g transform="translate(194 218)"><text x="15.6" fill="#569cd6">&quot;location&quot;</text><text x="93.6" fill="#d4d4d4">:</text><text x="109.2" fill="#ce9178">&quot;Johannesburg&quot;</text><text x="218.4" fill="#d4d4d4">,</text></g>
  </g>
  <g class="cl5">
    <text x="184" y="238" fill="#6a737d" text-anchor="end" font-size="11">6</text>
    <g transform="translate(194 238)"><text x="15.6" fill="#569cd6">&quot;tagline&quot;</text><text x="85.8" fill="#d4d4d4">:</text><text x="101.39999999999999" fill="#ce9178">&quot;Building things that work. Breaking things to learn why.&quot;</text></g>
  </g>
  <g class="cl6">
    <text x="184" y="258" fill="#6a737d" text-anchor="end" font-size="11">7</text>
    <g transform="translate(194 258)"><text x="0" fill="#d4d4d4">}</text></g>
  </g>

  <!-- Blinking cursor at end of last value line -->
  <rect x="747.8" y="227" width="2" height="16" fill="#d4d4d4" style="animation: blink 1s steps(1) infinite"/>
</svg>